name: Publish Java SDK

on:
  push:
    tags:
      - "java/v*"

jobs:
  publish:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#java/v}" >> "$GITHUB_OUTPUT"
      - run: mvn --no-transfer-progress versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false
      - run: mvn --no-transfer-progress --batch-mode deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

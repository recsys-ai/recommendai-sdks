name: Publish Kotlin SDK

on:
  push:
    tags:
      - "kotlin/v*"

jobs:
  publish:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#kotlin/v}" >> "$GITHUB_OUTPUT"
      - run: ./gradlew publishToMavenCentral -Pversion=${{ steps.ver.outputs.version }} --no-daemon
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

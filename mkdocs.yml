site_name: RecSys.AI SDK
site_description: Official client libraries for the RecSys.AI recommendation platform
site_url: https://recsys-ai.github.io/recommendai-sdks/
repo_url: https://github.com/recsys-ai/recommendai-sdks
repo_name: recsys-ai/recommendai-sdks
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - SDKs:
    - Python: python.md
    - TypeScript: typescript.md
    - Go: go.md
    - Dart: dart.md
    - .NET: dotnet.md
    - Java: java.md
    - Kotlin: kotlin.md
    - PHP: php.md
    - Ruby: ruby.md
    - Rust: rust.md
    - Swift: swift.md
